name: agent-grid
owner: Karnaf0katom
purpose: Standalone open-source presentation and manual control of host-owned agent sessions
entry: README.md
library: ../../packages/agent-grid
parts:
  app: server.js
  browser: public/
  host_adapters: adapters/
  tests: tests/
  distribution: scripts/export.py
